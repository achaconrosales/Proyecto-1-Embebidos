# Capas activas con las que se compiló la imagen (rama Wrynose).
# Las rutas /mnt/taller/taller-yocto son las del equipo de desarrollo: ajústenlas a su instalación.
# Referencia generada a partir de "bitbake-layers show-layers".
# Reemplácenlo por la copia real:
#   cp /mnt/taller/taller-yocto/build/conf/bblayers.conf yocto/conf/
POKY_BBLAYERS_CONF_VERSION = "2"

BBPATH = "${TOPDIR}"
BBFILES ?= ""

BBLAYERS ?= " \
  /mnt/taller/taller-yocto/layers/openembedded-core/meta \
  /mnt/taller/taller-yocto/layers/meta-yocto/meta-poky \
  /mnt/taller/taller-yocto/layers/meta-openembedded/meta-oe \
  /mnt/taller/taller-yocto/layers/meta-openembedded/meta-python \
  /mnt/taller/taller-yocto/layers/meta-taller \
  /mnt/taller/taller-yocto/layers/meta-raspberrypi \
  /mnt/taller/taller-yocto/layers/meta-control-acceso \
  "
